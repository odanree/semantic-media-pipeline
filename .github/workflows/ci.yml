name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # also run on main so merge commits are validated

jobs:
  # -------------------------------------------------------------------------
  # Frontend: TypeScript type check (Next.js, strict mode)
  # -------------------------------------------------------------------------
  typecheck-frontend:
    name: TypeCheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # -------------------------------------------------------------------------
  # Python: lint + syntax check (api + worker)
  # -------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin ruff so a new upstream release can't silently break CI by
      # enabling new default rules against unchanged code (beacon-mcp
      # got bitten this way on 2026-07-24). Bump deliberately.
      - name: Install ruff
        run: pip install "ruff==0.16.2"

      - name: Lint api/
        run: ruff check api/ --select=E,F,W --ignore=E501,E402,F401
        # E501 = line length, E402 = module-level import not at top (builtins patch in main.py)
        # F401 = unused imports (pre-existing, addressed separately)

      - name: Lint worker/
        run: ruff check worker/ --select=E,F,W --ignore=E501,E402,F401

  # -------------------------------------------------------------------------
  # Validate docker-compose config parses without errors
  # (catches typos, missing keys, bad YAML)
  # -------------------------------------------------------------------------
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docker-compose.yml is valid
        run: |
          # docker-compose uses env_file: .env — create a stub so it doesn't fail
          touch .env
          docker compose config > /dev/null
        env:
          # Provide dummy values so interpolation doesn't fail on missing vars
          DATABASE_URL: postgresql://user:pass@postgres:5432/lumen
          DATABASE_ASYNC_URL: postgresql+asyncpg://user:pass@postgres:5432/lumen
          REDIS_URL: redis://redis:6379
          QDRANT_HOST: qdrant
          S3_ENDPOINT_URL: https://placeholder.r2.cloudflarestorage.com
          S3_BUCKET: lumen-media
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder
          STORAGE_BACKEND: s3
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_STREAM_URL: http://localhost:8000
          L1_MEDIA_1: /tmp/media
          L1_MEDIA_2: /tmp/media
          L2_MEDIA_1: /tmp/media
          L2_MEDIA_2: /tmp/media
          L2_MEDIA_3: /tmp/media
          L2_MEDIA_4: /tmp/media
          L2_MEDIA_5: /tmp/media
          DATABASE_USER: lumen_user
          DATABASE_PASSWORD: secure_password_here
          DATABASE_NAME: lumen
          GF_SECURITY_ADMIN_PASSWORD: ci-placeholder
          MINIO_ROOT_PASSWORD: ci-placeholder

  # -------------------------------------------------------------------------
  # Frontend: vitest unit tests + coverage threshold guard
  # Fails if statements/lines/branches drop below thresholds in vitest.config.ts
  # -------------------------------------------------------------------------
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

  # -------------------------------------------------------------------------
  # API tests — FastAPI TestClient (no live services required)
  # -------------------------------------------------------------------------
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps (no ML libs)
        run: pip install -r api/requirements-noml.txt

      - name: Install test deps
        run: pip install -r api/requirements-test.txt

      - name: Run pytest
        env:
          REDIS_URL: memory://
        run: pytest --cov=api --cov-report=term-missing --cov-fail-under=72 -q
        # Threshold history: 77 → 74 → 70 → 72. The voting/search/training port briefly
        # dropped it to 70; vote-endpoint + training-readiness unit tests restored it to 72.
        # The residual gap to the old 74 is endpoints that require a live async DB
        # (/search/filename, /votes/stats, /votes/batch) or ffmpeg (HLS) — integration-only.

  # -------------------------------------------------------------------------
  # Check requirements files are pip-installable (syntax + version conflicts)
  # -------------------------------------------------------------------------
  check-requirements:
    name: Check requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry-run install api/requirements.txt
        run: pip install --dry-run -r api/requirements.txt

      - name: Check worker requirements exist
        run: |
          if [ -f worker/requirements.txt ]; then
            pip install --dry-run -r worker/requirements.txt
          else
            echo "No worker/requirements.txt — skipping"
          fi

  # -------------------------------------------------------------------------
  # Dependency vulnerability scan (pip-audit)
  # -------------------------------------------------------------------------
  audit-dependencies:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit api/requirements.txt
        run: >
          pip-audit -r api/requirements.txt
          --ignore-vuln CVE-2025-69872
          --ignore-vuln CVE-2026-28500
          --ignore-vuln CVE-2026-4539
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2025-203 --ignore-vuln PYSEC-2025-204
          --ignore-vuln PYSEC-2025-206 --ignore-vuln PYSEC-2026-139
          --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-2286
          --ignore-vuln CVE-2026-6587
          --ignore-vuln PYSEC-2026-3046
          --ignore-vuln CVE-2025-2999 --ignore-vuln CVE-2025-3000 --ignore-vuln CVE-2025-3001
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-2447
        # python-dotenv (CVE-2026-28684) and pillow (CVE-2026-40192/42308-42311 + the 2026
        # 12.3.0 batch: PYSEC-2026-2253..2257, 3451..3454, 3493..3496) are FIXED by version
        # bumps in requirements.txt (dotenv 1.2.2, pillow 12.3.0). The rest have no safe fix here:
        # CVE-2025-69872 affects diskcache (transitive via mlflow). No fix as of 2026-03-11.
        # CVE-2026-28500 affects onnx 1.20.1. No fix as of 2026-03-16.
        # CVE-2026-4539 affects pygments (transitive). No fix as of 2026-03-26.
        # PYSEC-2026-161 affects starlette 0.52.1 — pinned transitively by fastapi==0.135.1;
        #   the fix (1.0.1) is a major bump that conflicts with the FastAPI pin. Deferred.
        # PYSEC-2025-203/204/206 + PYSEC-2026-139 + PYSEC-2025-194 + PYSEC-2026-2286
        #   + CVE-2025-2999/3000/3001 all affect torch 2.8.0. Fixes: 2.9.0/2.9.1 for
        #   203/204/206/2999, 2.10.0 for 2286/3001, 2.13.0 for 194; 139 + 3000 have no fix.
        #   ML regression testing needed. Deferred to a coordinated tested bump.
        # CVE-2026-6587 + PYSEC-2026-3046 affect ragas 0.4.3 (transitive via eval deps) —
        #   no fix versions available.
        # PYSEC-2026-3552 affects cryptography <50.0.0 (transitive). Will resolve on next
        #   lockfile refresh — no direct pin here to bump.
        # PYSEC-2026-2447 affects diskcache 5.6.3 (transitive via mlflow). No fix as of 2026-07.

  # -------------------------------------------------------------------------
  # Secret scanning (trufflehog — detects leaked credentials in git history)
  # -------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for trufflehog

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
